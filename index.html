<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakkegeneratoren – Evenstad Musikk (prototype v2)</title>
<style>
:root{
  --g900:#123528; --g800:#153e31; --g700:#195b47; --g600:#22745b; --g100:#e3efe9; --g50:#f2f7f4;
  --ink:#16201c; --muted:#5a6762; --line:#d8e0dc; --bg:#f6f8f7; --white:#fff;
  --warn:#8a5a00; --warnbg:#fff4dc; --err:#a32020; --errbg:#fde8e8; --ok:#17653f; --okbg:#e2f4ea; --info:#1d4f80; --infobg:#e6f0fa;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g700)}
:focus-visible{outline:3px solid #f0b400;outline-offset:2px}
.sr{position:absolute;left:-9999px}
/* top bar */
.top{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.04em;color:var(--g800);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.logo .dot{width:26px;height:26px;border-radius:50%;background:var(--g700);color:#fff;display:grid;place-items:center;font-size:14px}
.nav{display:flex;gap:18px;color:var(--muted);font-size:14px;margin-left:12px}
.spacer{flex:1}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:13px}
.mode button{border:0;background:none;padding:6px 12px;cursor:pointer}
.mode button[aria-pressed=true]{background:var(--g800);color:#fff}
.cart{font-size:14px;background:var(--g50);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:34px;line-height:1.15;margin:.2em 0 .3em}
h2{font-size:22px;margin:.2em 0 .5em}
h3{font-size:17px;margin:.2em 0 .3em}
p.lead{color:var(--muted);margin-top:0;max-width:640px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:11px 18px;font-weight:650;cursor:pointer;border:1px solid transparent;text-decoration:none}
.btn.pri{background:var(--g700);color:#fff}
.btn.pri:hover{background:var(--g800)}
.btn.sec{background:var(--white);border-color:var(--line);color:var(--ink)}
.btn.sec:hover{border-color:var(--g600)}
.btn.ghost{background:none;border:0;color:var(--g700);padding:6px 4px;text-decoration:underline}
.btn.small{padding:6px 10px;font-size:14px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}.nav{display:none}.top .in{gap:8px;padding:8px 12px}.logo{font-size:13px;letter-spacing:0}.mode button{padding:5px 8px}.cart{padding:5px 8px}.steps li{font-size:11px}.split{grid-template-columns:1fr!important}h1{font-size:28px}}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--g100);color:var(--g800)}
.badge.warn{background:var(--warnbg);color:var(--warn)} .badge.err{background:var(--errbg);color:var(--err)} .badge.info{background:var(--infobg);color:var(--info)} .badge.gray{background:#eceeed;color:#4a5450}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.price{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
/* hero */
.hero{background:var(--g800);color:#fff;border-radius:16px;padding:36px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.hero p{color:#cfe3da}
.hero .art{background:#0f2c22 url(data:image/svg+xml;utf8,) center/cover;border-radius:12px;min-height:200px;display:grid;place-items:center;font-size:80px;color:#5fb08f}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding:24px}}
.uses{margin-top:28px}
.usecard{display:block;text-align:left;width:100%;cursor:pointer;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:.1s}
.usecard:hover{border-color:var(--g600);transform:translateY(-1px)}
.usecard .ic{font-size:26px}
.usecard[aria-pressed=true]{border:2px solid var(--g700);background:var(--g50)}
/* stepper */
.steps{display:flex;gap:6px;margin:4px 0 18px;list-style:none;padding:0}
.steps li{flex:1;font-size:13px;color:var(--muted)}
.steps li .bar{height:5px;border-radius:3px;background:var(--line);margin-bottom:6px}
.steps li.done .bar,.steps li.cur .bar{background:var(--g700)}
.steps li.cur{color:var(--ink);font-weight:700}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.opt:hover{border-color:var(--g600)}
.opt[aria-pressed=true],.opt[aria-checked=true]{border:2px solid var(--g700);background:var(--g50)}
.opt .box{width:22px;height:22px;border:2px solid #9aa8a2;border-radius:6px;flex:none;display:grid;place-items:center;margin-top:2px;font-size:14px;color:#fff}
.opt[aria-checked=true] .box{background:var(--g700);border-color:var(--g700)}
.wizfoot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--g700)}
.budget-val{font-size:32px;font-weight:800;color:var(--g800)}
/* levels */
.level{position:relative;display:flex;flex-direction:column;gap:8px}
.level.rec{border:2px solid var(--g700);box-shadow:0 6px 20px rgba(21,62,49,.12)}
.level .tag{position:absolute;top:-12px;left:16px}
.level ul{margin:4px 0 8px;padding-left:18px;font-size:14px;color:var(--muted)}
.level .tot{font-size:26px}
/* package page */
.split{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.thumb{width:52px;height:52px;border-radius:8px;background:var(--g50);display:grid;place-items:center;font-size:24px;border:1px solid var(--line)}
.item .nm{font-weight:650}
.item .why{font-size:14px;color:#33413b;background:var(--g50);border-left:3px solid var(--g600);padding:8px 10px;border-radius:4px;margin-top:6px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.item.owned{opacity:.75}
.item.owned .nm{text-decoration:line-through}
.stock{font-size:13px}
.stock.ok{color:var(--ok)} .stock.sup{color:var(--warn)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:650}
.swap{margin-top:8px;padding:10px;border:1px dashed var(--g600);border-radius:8px;background:#fbfdfc}
.swap .s{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.swap .s:first-of-type{border-top:0}
.sticky{position:sticky;top:76px;display:flex;flex-direction:column;gap:16px}
.check{border-radius:var(--r);padding:16px;border:1px solid var(--line);background:var(--white)}
.check.ok{background:var(--okbg);border-color:#b7e0c8}
.msg{display:flex;flex-wrap:wrap;gap:6px 10px;padding:10px 12px;border-radius:8px;margin-top:8px;font-size:14px;align-items:flex-start}
.msg > span:nth-child(2){flex:1 1 180px}
.msg .i{font-weight:800;flex:none;width:20px;text-align:center}
.msg.err{background:var(--errbg);color:var(--err)} .msg.warn{background:var(--warnbg);color:var(--warn)} .msg.info{background:var(--infobg);color:var(--info)} .msg.ok{background:var(--okbg);color:var(--ok)}
.msg .fix{margin-left:30px;flex:none}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sum .big{font-size:30px}
.remember li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.remember li:first-child{border-top:0}
.remember ul{list-style:none;margin:0;padding:0}
/* forms */
label.f{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
.inp{width:100%;padding:10px 12px;border:1px solid #b9c5c0;border-radius:8px;background:#fff}
textarea.inp{min-height:90px}
/* staff */
.staffbar{background:#2b2f2d;color:#fff;padding:8px 20px;font-size:13px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr.click{cursor:pointer} tr.click:hover{background:var(--g50)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}
/* drawer */
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:50}
.drawer .pane{background:#fff;width:min(420px,100%);height:100%;overflow:auto;padding:24px}
.gloss dt{font-weight:700;margin-top:12px}
.gloss dd{margin:2px 0 0}
/* event log */
.evlog{position:fixed;right:12px;bottom:12px;width:300px;max-height:260px;overflow:auto;background:#111;color:#9fe0c0;font:12px/1.5 ui-monospace,Menlo,monospace;border-radius:8px;padding:10px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.evlog b{color:#fff}
footer{max-width:1080px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g900);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px}
</style>
</head>

/* ---------------- package logic ---------------- */
function ownedRemovesCat(id){
  const c=P[id].caps, o=S.owned;
  if(o.has('hp') && P[id].cat==='hp') return true;
  if(o.has('xlrmic') && c.xlrmic) return true;
  if(o.has('usbmic') && c.usbmic) return true;
  if(o.has('iface') && P[id].cat==='iface') return true;
  if(o.has('spk') && (c.pa||c.mon)) return true;
  if(o.has('stand') && c.stand && (USE.key==='stream'||USE.key==='studio')) return true;
  return false;
}
function buildPkg(level){
  const items={};
  for(const [id,q] of Object.entries(level.items)) items[id]={q, owned:ownedRemovesCat(id)};
  // har du egen XLR-mikrofon men pakken har USB-mikrofon -> legg til lydkort og kabel
  if(S.owned.has('xlrmic') && items.usbmic){ items.usbmic.owned=true; if(!items.iface2 && !S.owned.has('iface')) items.iface2={q:1,owned:false,added:true}; if(!items.xlr3) items.xlr3={q:1,owned:false,added:true}; }
  return {name:level.n, items};
}
function active(pkg){ return Object.entries(pkg.items).filter(([id,v])=>!v.owned && v.q>0); }
function capCount(pkg,cap,{incOwned=false}={}){
  let n=0; for(const [id,v] of Object.entries(pkg.items)){ if(v.q<=0) continue; if(v.owned && !incOwned) continue; const c=P[id].caps[cap]; if(c) n+= (cap==='in'||cap==='hpout')? c*1 : c*v.q; }
  return n;
}
function total(pkg){ return active(pkg).reduce((s,[id,v])=>s+P[id].p*v.q,0); }
function delivery(pkg){ const sup=active(pkg).some(([id])=>P[id].s==='lev'); return {sup, date:addDays(today, sup?5:2)}; }
function checks(pkg){
  const out=[]; const o=S.owned;
  const mics = capCount(pkg,'xlrmic',{incOwned:true}) + (o.has('xlrmic') && !capCount(pkg,'xlrmic',{incOwned:true})?1:0);
  const hasIface = capCount(pkg,'iface')>0 || capCount(pkg,'mixer')>0 || o.has('iface');
  const isLive = USE.key==='live';
  if(mics>0 && !hasIface){
    out.push({lv:'err',t: isLive?'Mikrofonene må kobles til en mikser – pakken har ingen.':'En XLR-mikrofon kan ikke kobles rett i PC-en. Den trenger et lydkort.', fix: isLive?'mix6':'iface2'});
  }
  const inputs = capCount(pkg,'in');
  if(mics>0 && inputs>0 && mics>inputs){ out.push({lv:'err',t:`${mics} mikrofoner, men ${isLive?'mikseren':'lydkortet'} har bare ${inputs} mikrofoninnganger.`, fix: isLive?'mix12':(USE.key==='pod'?'podmix':'iface4'), fixMode:'swapIface'}); }
  const cables = capCount(pkg,'xlr',{incOwned:true});
  const needCables = mics + (isLive? capCount(pkg,'smon'):0);
  if(needCables>cables){ out.push({lv:'warn',t:`Du har ${needCables} ${isLive&&capCount(pkg,'smon')?'mikrofoner og monitorer':'mikrofoner'}, men bare ${cables} XLR-kabler.`, fix:isLive?'xlr6':'xlr3', fixQty:needCables-cables}); }
  if(capCount(pkg,'lowgain')>0 && capCount(pkg,'inamp')===0){ out.push({lv:'warn',t:'Kringkastingsmikrofonen gir svært lite signal. Uten inline-forsterker kan lyden bli svak og suse.', fix:'inamp'}); }
  if(o.has('xlrmic') && (USE.key==='stream'||USE.key==='pod') && capCount(pkg,'inamp')===0){ out.push({lv:'info',t:'Er mikrofonen din en kringkastingsmikrofon (f.eks. til podkast)? Mange av dem trenger en inline-forsterker.', fix:'inamp'}); }
  const hps = capCount(pkg,'hp',{incOwned:true}) + (o.has('hp')&&capCount(pkg,'hp',{incOwned:true})===0?1:0);
  const hpouts = capCount(pkg,'hpout');
  if(!isLive && hpouts>0 && hps>hpouts){ out.push({lv:'warn',t:`${hps} hodetelefoner, men bare ${hpouts} hodetelefonutgang${hpouts>1?'er':''}.`, fix:'hpamp'}); }
  const pas=capCount(pkg,'pa',{incOwned:false});
  if(pas>0 && capCount(pkg,'mixer')===0 && !o.has('iface')){ out.push({lv:'err',t:'Høyttalerne trenger en mikser å få lyd fra.', fix:'mix6'}); }
  if(pas>0 && capCount(pkg,'spkcab')<pas){ out.push({lv:'warn',t:`${pas} høyttalere, men ${capCount(pkg,'spkcab')} signalkabler.`, fix:'spkcab', fixQty:pas-capCount(pkg,'spkcab')}); }
  if(capCount(pkg,'smon')>0 && capCount(pkg,'aux')===0){ out.push({lv:'err',t:'Scenemonitorene trenger en mikser med egne monitorutganger.', fix:'mix12', fixMode:'swapIface'}); }
  if(capCount(pkg,'mon')>0 && capCount(pkg,'moncab')===0){ out.push({lv:'warn',t:'Studiomonitorene trenger kabler til lydkortet.', fix:'moncab'}); }
  const micsInPkg = capCount(pkg,'xlrmic')+capCount(pkg,'usbmic');
  if(micsInPkg>0 && capCount(pkg,'stand',{incOwned:true})<micsInPkg && !o.has('stand')){ out.push({lv:'info',t:'Ikke alle mikrofonene har stativ.', fix: USE.key==='live'?'micst':(USE.key==='pod'?'desk':'arm'), fixQty: micsInPkg-capCount(pkg,'stand',{incOwned:true})}); }
  if(o.has('spk') && isLive){ out.push({lv:'info',t:'Du har egne høyttalere. Er de passive (uten innebygd forsterker), trenger du en forsterker. Send pakken til en selger for sjekk.', req:true}); }
  if(o.has('iface')){ out.push({lv:'info',t:'Du har eget lydkort eller mikser. Sjekk at det har nok innganger og 48 V fantommating – eller la en selger sjekke det.', req:true}); }
  if(!isLive && (capCount(pkg,'iface')>0||capCount(pkg,'usbmic')>0) && !o.has('pc')){ out.push({lv:'info',t:'Lydkort og USB-mikrofoner kobles til en PC eller Mac med USB. Pakken inneholder ikke PC.'}); }
  return out;
}

function vGloss(){ return S.gloss?`<div class="drawer"><div class="pane" role="dialog" aria-modal="true" aria-label="Ordliste"><div class="row" style="justify-content:space-between"><h2>Ordliste</h2><button class="btn sec small" data-closegloss>Lukk</button></div><dl class="gloss">${GLOSS.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></div></div>`:''; }

function render(){
  let v='';
  if(S.mode==='ansatt'){ v = S.openReq===null?vStaffList():vStaffDetail(); }
  else switch(S.view){
    case 'home': v=vHome(); break;

    case 'levels': USE=USES[S.use]; v=vLevels(); break;
    case 'package': USE=USES[S.use]; v=vPackage(); break;

    case 'offer': v=vOffer(); break;

  $app.innerHTML = topbar()+`<main id="main">${v}</main><footer><span>Prototype v2 · IS-219 gruppe 21 · Generiske produkter og eksempelpriser</span><span><button class="btn ghost small" data-evlog>${S.evlog?'Skjul':'Vis'} målepunkter</button></span></footer>`+vGloss()+vEv();
  const r=document.getElementById('bud'); if(r) r.oninput=e=>{S.budget=+e.target.value;document.getElementById('budv').textContent=kr(S.budget);e.target.setAttribute('aria-valuetext',kr(S.budget));};
  const f=document.getElementById('reqform'); if(f) f.onsubmit=submitReq;

function go(view){ S.view=view; S.swapFor=null; render(); window.scrollTo(0,0); }
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function submitReq(e){
  e.preventDefault();
  const navn=document.getElementById('navn').value.trim(), ep=document.getElementById('epost').value.trim(), k=document.getElementById('komm').value.trim();
  S.contact={navn,epost:ep,kommentar:k};
  if(!navn||!/^\S+@\S+\.\S+$/.test(ep)){ document.getElementById('formerr').textContent='Fyll inn navn og en gyldig e-postadresse.'; return; }
  const items=Object.fromEntries(active(S.pkg).map(([id,v])=>[id,v.q]));
  S.requests.unshift({ref:'EM-2611-0'+(20+S.requests.length),kunde:navn,epost:ep,use:S.use,level:S.pkg.name,exp:S.exp||'litt',owned:[...S.owned],status:'Ny',items,kommentar:k,dato:'25.11.'});
  ev('generate_lead',{pakke:S.use+'/'+S.pkg.name,value:total(S.pkg)});
  go('sent');
}
document.addEventListener('click',e=>{
  if(e.target.classList && e.target.classList.contains('drawer')){S.gloss=false;render();return;}
  const t=e.target.closest('button,tr[data-openreq]'); if(!t) return;
  const d=t.dataset;
  if('closegloss' in d){S.gloss=false;render();return;}
  if(d.go){ if(d.go==='request' && !S.pkg) return; go(d.go); return; }
  if(d.mode){ S.mode=d.mode; S.openReq=null; if(d.mode==='ansatt'&&S.requests[0]&&S.requests[0].status==='Ny'&&S.view==='sent'){S.openReq=0;} render(); window.scrollTo(0,0); return; }
  if('start' in d){ S.use=d.start||null; S.step=d.start?1:0; S.view='wizard'; ev('select_promotion',{bruk:S.use||'ikke valgt'}); render(); window.scrollTo(0,0); return; }
  if(d.use){ S.use=d.use; render(); return; }
  if(d.exp){ S.exp=d.exp; render(); return; }
  if(d.own){ S.owned.has(d.own)?S.owned.delete(d.own):S.owned.add(d.own); render(); return; }
  if('nobudget' in d){ S.noBudget=!S.noBudget; render(); return; }
  if('back' in d){ if(S.view==='levels'){S.view='wizard';S.step=3;} else S.step=Math.max(0,S.step-1); render(); return; }
  if('skip' in d){ S.exp='erf'; S.noBudget=true; S.step=4; go('levels'); ev('view_item_list',{bruk:S.use,hoppet_over:true}); return; }
  if('next' in d){ if(S.step<3){S.step++;render();window.scrollTo(0,0);} else {S.step=4; go('levels'); ev('view_item_list',{bruk:S.use,budsjett:S.noBudget?'vet ikke':S.budget});} return; }
  if(d.level!==undefined){ USE=USES[S.use]; S.levelIx=+d.level; S.pkg=buildPkg(USE.levels[S.levelIx]); S.openWhy=new Set(); ev('select_item',{pakke:S.use+'/'+USE.levels[S.levelIx].n}); go('package'); return; }
  if(d.why){ S.openWhy.has(d.why)?S.openWhy.delete(d.why):S.openWhy.add(d.why); render(); return; }
  if(d.swap){ S.swapFor = S.swapFor===d.swap?null:d.swap; render(); return; }
  if(d.swapto){ const from=S.swapFor; const q=S.pkg.items[from].q; delete S.pkg.items[from]; S.pkg.items[d.swapto]={q,owned:false}; S.swapFor=null; ev('pakke_bytt',{fra:from,til:d.swapto}); render(); toast('Byttet til '+P[d.swapto].n); return; }
  if(d.remove){ S.pkg.items[d.remove].q=0; ev('remove_from_cart',{vare:d.remove}); render(); toast(P[d.remove].n+' er fjernet – se pakkesjekken'); return; }
  if(d.unown){ S.pkg.items[d.unown].owned=false; render(); return; }
  if(d.qty){ const it=S.pkg.items[d.qty]; it.q=Math.max(0,it.q+ +d.d); render(); return; }
  if(d.add){ const it=S.pkg.items[d.add]; if(it){it.q=Math.max(1,it.q+ (it.q>0?1:1)); it.owned=false;} else S.pkg.items[d.add]={q:1,owned:false}; ev('add_to_cart',{vare:d.add,kilde:'har_du_husket'}); render(); toast(P[d.add].n+' lagt til'); return; }
  if(d.fix && S.mode==='ansatt'){ const r=S.requests[S.openReq]; if(!r||r.status==='Tilbud sendt') return;
    if(d.fm==='swapIface'){ const cur=Object.keys(r.items).find(id=>P[id].cat==='iface'&&r.items[id]>0); if(cur) delete r.items[cur]; r.items[d.fix]=1; }
    else r.items[d.fix]=(r.items[d.fix]||0)+ +d.fq;
    r.changed=[...(r.changed||[]),d.fix]; render(); toast('Lagt til i tilbudet'); return; }
  if(d.fix){ const pk = S.pkg; if(!pk) return;
    if(d.fm==='swapIface'){ const cur=Object.keys(pk.items).find(id=>P[id].cat==='iface' && pk.items[id].q>0); if(cur) delete pk.items[cur]; pk.items[d.fix]={q:1,owned:false}; }
    else { const it=pk.items[d.fix]; if(it&&it.q>0&&!it.owned) it.q+= +d.fq; else pk.items[d.fix]={q:+d.fq,owned:false}; }
    ev('pakkesjekk_fiks',{vare:d.fix}); render(); toast('Pakken er oppdatert'); return; }
  if('buy' in d){ S.cart={...S.pkg,items:JSON.parse(JSON.stringify(S.pkg.items))}; ev('add_to_cart',{pakke:S.use+'/'+S.pkg.name,value:total(S.pkg)}); toast('Pakken ligger i handlekurven'); ev('begin_checkout',{value:total(S.pkg)}); go('cart'); return; }
  if('order' in d){ const pkg=S.cart; USE=USE||USES[S.use]; S.order={no:'EM-TEST-'+(1000+Math.floor(Math.random()*900)),total:total(pkg),date:delivery(pkg).date}; ev('purchase',{value:S.order.total}); S.cart=null; go('order'); return; }
  if('gloss' in d){ S.gloss=true; render(); return; }
  if('evlog' in d){ S.evlog=!S.evlog; render(); return; }
  // ansatt
  if(d.openreq!==undefined){ S.openReq=+d.openreq; render(); window.scrollTo(0,0); return; }
  if('staffback' in d){ S.openReq=null; render(); return; }
  if(d.sqty){ const r=S.requests[S.openReq]; r.items[d.sqty]=Math.max(0,(r.items[d.sqty]||0)+ +d.d); r.changed=[...(r.changed||[]),d.sqty]; render(); return; }
  if('saddbtn' in d){ const v=document.getElementById('sadd').value; if(!v) return; const r=S.requests[S.openReq]; r.items[v]=(r.items[v]||0)+1; r.changed=[...(r.changed||[]),v]; render(); return; }
  if(d.tpl){ const r=S.requests[S.openReq]; const tp={1:'Hei! Jeg har sjekket pakken, og alt passer sammen. Alt er på lager, så den kan sendes i morgen.',2:'Hei! Jeg har gjort en endring i pakken (merket «Endret av selger»), fordi … Ellers passer alt sammen.',3:'Hei! Takk for at du skrev hva du har fra før. Utstyret ditt kan brukes sammen med pakken, men …'}[d.tpl]; r.svarUtkast=tp; render(); return; }
  if('approve' in d){ const r=S.requests[S.openReq]; r.svar=document.getElementById('svar').value.trim()||'Pakken er sjekket, og alt passer sammen.'; r.status='Tilbud sendt'; ev('ordre_godkjent',{ref:r.ref,value:total(reqPkg(r))}); toast('Tilbud sendt til '+r.epost); render(); return; }
  if('askinfo' in d){ const r=S.requests[S.openReq]; r.status='Venter på kunde'; toast('E-post sendt til kunden med spørsmål'); render(); return; }
  if(d.viewoffer!==undefined){ S.offer=S.requests[+d.viewoffer]; S.mode='kunde'; go('offer'); return; }
  if('acceptoffer' in d){ const r=S.offer; USE=USES[r.use]; S.use=r.use; S.cart={name:r.level,title:'Tilbud '+r.ref,items:Object.fromEntries(Object.entries(r.items).map(([k,q])=>[k,{q,owned:false}]))}; ev('begin_checkout',{kilde:'tilbud',ref:r.ref}); go('cart'); return; }
});
document.addEventListener('change',e=>{
  const t=e.target; if(t.dataset.sswap&&t.value){ const r=S.requests[S.openReq]; const q=r.items[t.dataset.sswap]; delete r.items[t.dataset.sswap]; r.items[t.value]=q; r.changed=[...(r.changed||[]),t.value]; render(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.dataset && e.target.dataset.openreq!==undefined){ S.openReq=+e.target.dataset.openreq; render(); } if(e.key==='Escape'&&S.gloss){S.gloss=false;render();} });
// støtte for direkte lenker i test: #stream, #pod, #studio, #live, #ansatt
(function(){const hsh=location.hash.slice(1); if(USES[hsh]){S.use=hsh;S.step=1;S.view='wizard';} if(hsh==='ansatt'){S.mode='ansatt';} })();
render();
</script>
</body>
